# NOTE: The TLS server block below requires Let's Encrypt certificates to exist
# at the referenced paths. Apply this config only after certs are issued (e.g.
# `certbot --nginx` or `certbot certonly`), otherwise `nginx -t` / reload will
# fail. Certbot may also manage its own edits to this file on the server.

# Redirect all HTTP traffic to HTTPS. Redirect to the literal canonical host
# (not $host) so a spoofed Host header cannot turn this into an open redirect.
# This also matches the app's canonical origin used by CORS in server/index.js.
server {
    listen 80;
    server_name promptfixer.co www.promptfixer.co;

    return 301 https://promptfixer.co$request_uri;
}

# Main HTTPS server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name promptfixer.co www.promptfixer.co;

    ssl_certificate /etc/letsencrypt/live/promptfixer.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promptfixer.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Enforce HTTPS for future requests (2 years, includeSubDomains).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://localhost:3001; # Proxy to Express app
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Forward the real client IP so Express (trust proxy) can rate-limit per user.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
